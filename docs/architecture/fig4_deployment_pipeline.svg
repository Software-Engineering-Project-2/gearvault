">9 / 9 smoke tests passed</text><path d="M803.0,-29.0 L868,-29.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-29.0" r="2.2" fill="#777"/><text x="880" y="-33.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Reads the account ID; bucket names and fresh JWT /</text><text x="880" y="-13.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">origin secrets are derived at run time</text><path d="M803.0,-113.0 L868,-113.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-113.0" r="2.2" fill="#777"/><text x="880" y="-117.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">10.0.0.0/16 across ap-south-1a/b with one NAT Gateway;</text><text x="880" y="-97.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">waits until the NAT Gateway is available</text><path d="M803.0,-197.0 L868,-197.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-197.0" r="2.2" fill="#777"/><text x="880" y="-201.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">gearvault-frontend-&lt;account&gt; holds the SPA,</text><text x="880" y="-181.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">gearvault-media-&lt;account&gt; holds photos</text><path d="M803.0,-281.0 L868,-281.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-281.0" r="2.2" fill="#777"/><text x="880" y="-285.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">db.t4g.micro, 20 GB gp3, encrypted, not public;</text><text x="880" y="-265.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">blocks ~8–10 min on db-instance-available</text><path d="M803.0,-365.0 L868,-365.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-365.0" r="2.2" fill="#777"/><text x="880" y="-369.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">DATABASE_URL (sslmode=require) + JWT_SECRET_KEY;</text><text x="880" y="-349.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">nothing secret is baked into the image</text><path d="M803.0,-449.0 L868,-449.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-449.0" r="2.2" fill="#777"/><text x="880" y="-453.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">IP-type targets with /api/health checks;</text><text x="880" y="-433.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">ALB spans both public subnets</text><path d="M803.0,-533.0 L868,-533.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-533.0" r="2.2" fill="#777"/><text x="880" y="-537.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Image built for linux/amd64 and scanned on push;</text><text x="880" y="-517.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">roles trusted by ecs-tasks.amazonaws.com</text><path d="M803.0,-617.0 L868,-617.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-617.0" r="2.2" fill="#777"/><text x="880" y="-621.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">0.5 vCPU / 1 GB task; one-off RunTask runs flask db upgrade,</text><text x="880" y="-601.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">then flask seed (5 categories, 11 items)</text><path d="M803.0,-701.0 L868,-701.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-701.0" r="2.2" fill="#777"/><text x="880" y="-705.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Rolling deploy (100 % min / 200 % max) with auto rollback;</text><text x="880" y="-685.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Application Auto Scaling keeps 2–4 tasks</text><path d="M803.0,-785.0 L868,-785.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-785.0" r="2.2" fill="#777"/><text x="880" y="-789.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">WAF for CloudFront is global, so the Web ACL lives in</text><text x="880" y="-769.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">us-east-1; the distribution fronts S3 and the ALB</text><path d="M803.0,-869.0 L868,-869.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-869.0" r="2.2" fill="#777"/><text x="880" y="-873.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Scheduler may RunTask and iam:PassRole the task roles;</text><text x="880" y="-853.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">runs flask jobs run in a private subnet</text><path d="M803.0,-953.0 L868,-953.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="803.0" cy="-953.0" r="2.2" fill="#777"/><text x="880" y="-957.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Alarms on ALB 5XX &gt; 10 / 5 min and RDS CPU &gt; 80 %;</text><text x="880" y="-937.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Vite build is synced to S3 with --delete</text><path d="M267.0,-390 L255.0,-390 L255.0,-4 L267.0,-4" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/><text x="243.0" y="-197.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic" transform="rotate(-90 243.0 -197.0)">Foundation</text><path d="M267.0,-726 L255.0,-726 L255.0,-424 L267.0,-424" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/><text x="243.0" y="-575.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic" transform="rotate(-90 243.0 -575.0)">Application</text><path d="M267.0,-978 L255.0,-978 L255.0,-760 L267.0,-760" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/><text x="243.0" y="-869.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic" transform="rotate(-90 243.0 -869.0)">Edge &amp; operations</text><text x="780.0" y="150" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000">Figure 4.  Automated provisioning pipeline (deploy-all.ps1) — each phase depends on the ones below it.</text></g></svg>