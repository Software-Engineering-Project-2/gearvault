text x="560" y="-181.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">S3 frontend + media buckets · CORS · access block</text><rect x="325.0" y="-310.0" width="470" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="-284.06300000000005" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Phase 3 · Database tier</text><text x="560" y="-265.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">DB subnet group · RDS PostgreSQL 16 Multi-AZ</text><rect x="325.0" y="-394.0" width="470" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="-368.06300000000005" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Phase 4 · Secrets</text><text x="560" y="-349.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">gearvault/production/credentials · origin-verify secret</text><rect x="325.0" y="-478.0" width="470" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="-452.06300000000005" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Phase 5 · Ingress</text><text x="560" y="-433.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">target group :5000 · internet-facing ALB · listener :80</text><rect x="325.0" y="-562.0" width="470" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="-536.063" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Phase 6 · Registry &amp; IAM</text><text x="560" y="-517.8860000000001" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">ECR repo · task-exec + task roles · docker build/push :v2</text><rect x="325.0" y="-646.0" width="470" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="-620.063" font-size="17" text-anchor="m