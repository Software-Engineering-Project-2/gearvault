<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1038" viewBox="0 0 1560 1038" font-family="'Times New Roman', Times, serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.6"/></marker></defs><rect width="1560" height="1038" fill="#fff"/><g transform="translate(0,854)"><rect x="352.0" y="-754" width="536.0" height="774" rx="18" fill="none" stroke="#000" stroke-width="1.8"/><text x="366.0" y="-732" font-size="15" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">Media upload &amp; retrieval</text><rect x="400.0" y="-58.0" width="440" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="-32.063" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">POST /api/uploads/presign</text><text x="620" y="-13.886000000000001" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">Bearer JWT · type, content_type, file_size</text><rect x="400.0" y="-146.0" width="440" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="-120.06299999999999" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Request validation</text><text x="620" y="-101.88599999999998" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">image/jpeg · png · webp only · ≤ 5 MB</text><path d="M620,-248.0 L695.0,-212.0 L620,-176.0 L545.0,-212.0 Z" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="-206.225" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000">Role allowed?</text><rect x="384.0" y="-336.0" width="230" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="499.0" y="-309.91700000000003" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">Item photo key</text><text x="499.0" y="-293.15" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">items/&lt;uuid&gt;.jpg</text><rect x="626.0" y="-336.0" width="230" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="741.0" y="-309.91700000000003" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">Condition photo key</text><text x="741.0" y="-293.15" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">condition/&lt;rental&gt;/&lt;uuid&gt;.jpg</text><rect x="400.0" y="-424.0" width="440" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="-398.06300000000005" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">boto3 presigned PUT URL</text><text x="620" y="-379.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">SigV4 · task-role STS credentials · ≤ 900 s</text><rect x="400.0" y="-512.0" width="440" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="-486.06300000000005" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Direct PUT from browser to S3</text><text x="620" y="-467.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">bucket CORS allows GET / PUT · ETag exposed</text><path d="M414.0,-611.0 L414.0,-553.0 A100.0,11 0 0 0 614.0,-553.0 L614.0,-611.0" fill="#fff" stroke="#000" stroke-width="1.5"/><ellipse cx="514.0" cy="-611.0" rx="100.0" ry="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="514.0" y="-580.46" font-size="15" text-anchor="middle" font-weight="normal" fill="#000">S3 media</text><text x="514.0" y="-562.46" font-size="15" text-anchor="middle" font-weight="normal" fill="#000">items/*</text><path d="M626.0,-611.0 L626.0,-553.0 A100.0,11 0 0 0 826.0,-553.0 L826.0,-611.0" fill="#fff" stroke="#000" stroke-width="1.5"/><ellipse cx="726.0" cy="-611.0" rx="100.0" ry="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="726.0" y="-580.46" font-size="15" text-anchor="middle" font-weight="normal" fill="#000">S3 media</text><text x="726.0" y="-562.46" font-size="15" text-anchor="middle" font-weight="normal" fill="#000">condition/*</text><rect x="384.0" y="-710.0" width="230" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="499.0" y="-683.9169999999999" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">CloudFront /media/*</text><text x="499.0" y="-667.15" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">OAC read · cached</text><rect x="626.0" y="-710.0" width="230" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="741.0" y="-683.9169999999999" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">Presigned GET</text><text x="741.0" y="-667.15" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">≤ 900 s · issued by API</text><path d="M620,-58 L620,-87" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M620,-146 L620,-175" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M620,-248 L620,-263.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M499.0,-263.0 L741.0,-263.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M499.0,-263.0 L499.0,-277" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M741.0,-263.0 L741.0,-277" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="630" y="-254" font-size="13.5" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">yes</text><path d="M499.0,-336 L499.0,-351.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M741.0,-336 L741.0,-351.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M499.0,-351.0 L741.0,-351.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M620,-351.0 L620,-365" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M620,-424 L620,-453" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M620,-512 L620,-527.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M514.0,-527.0 L726.0,-527.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M514.0,-527.0 L514.0,-541" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M726.0,-527.0 L726.0,-541" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M514.0,-622 L499.0,-651" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M726.0,-622 L741.0,-651" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="620" y="85.75" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Manager / staff selects a photo</text><text x="620" y="106.15" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">(browser)</text><path d="M620,58 L620,1" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M620,-710 L620,-792" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="620" y="-808.05" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Image shown in catalog or return inspection</text><path d="M848.0,-29.0 L888,-29.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="848.0" cy="-29.0" r="2.2" fill="#777"/><text x="900" y="-33.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">The browser asks the API for permission to upload;</text><text x="900" y="-13.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">the file itself never passes through Flask</text><path d="M848.0,-117.0 L888,-117.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="848.0" cy="-117.0" r="2.2" fill="#777"/><text x="900" y="-121.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Rejects other file types and oversized files</text><text x="900" y="-101.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">with HTTP 400 before anything is signed</text><path d="M864.0,-307.0 L888,-307.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="864.0" cy="-307.0" r="2.2" fill="#777"/><text x="900" y="-311.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Keys are generated by the server (UUID),</text><text x="900" y="-291.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">so clients cannot overwrite other objects</text><path d="M848.0,-395.0 L888,-395.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="848.0" cy="-395.0" r="2.2" fill="#777"/><text x="900" y="-399.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Signed with the ECS task role's temporary credentials;</text><text x="900" y="-379.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">the URL expires after at most 15 minutes</text><path d="M848.0,-483.0 L888,-483.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="848.0" cy="-483.0" r="2.2" fill="#777"/><text x="900" y="-487.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Upload bandwidth goes straight to S3,</text><text x="900" y="-467.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">keeping Fargate tasks small</text><path d="M834.0,-582.0 L888,-582.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="834.0" cy="-582.0" r="2.2" fill="#777"/><text x="900" y="-586.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">One bucket, two prefixes with different</text><text x="900" y="-566.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">visibility rules</text><path d="M864.0,-681.0 L888,-681.0" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="864.0" cy="-681.0" r="2.2" fill="#777"/><text x="900" y="-685.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Catalog photos are public through the CDN;</text><text x="900" y="-665.575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">inspection photos stay private</text><path d="M545,-212.0 L316,-212.0" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="450" y="-220.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">no</text><rect x="125.0" y="-241.0" width="190" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220" y="-215.063" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">HTTP 403</text><text x="220" y="-196.886" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">wrong role</text><text x="220" y="-153.775" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">items: manager only</text><text x="220" y="-136.775" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">condition: staff / manager</text><text x="780.0" y="150" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000">Figure 6.  Presigned-URL media pipeline — uploads go directly to S3; reads go through CloudFront or short-lived URLs.</text></g></svg>