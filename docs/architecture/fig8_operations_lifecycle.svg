<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860" font-family="'Times New Roman', Times, serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.6"/></marker></defs><rect width="1700" height="860" fill="#fff"/><rect x="70" y="155" width="320" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="230" y="194.65" font-size="19" text-anchor="middle" font-weight="normal" fill="#000">Not provisioned</text><text x="230" y="222" font-size="14" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">no resources · $0</text><rect x="690" y="155" width="320" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="850" y="194.65" font-size="19" text-anchor="middle" font-weight="normal" fill="#000">Running (live)</text><text x="850" y="222" font-size="14" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">2 tasks · RDS up · jobs every 5 min</text><rect x="1290" y="155" width="320" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="1450" y="194.65" font-size="19" text-anchor="middle" font-weight="normal" fill="#000">Paused (sleep mode)</text><text x="1450" y="222" font-size="14" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">0 tasks · RDS stopped · jobs off</text><path d="M390,180 L689,180" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="540" y="170" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">deploy-all.ps1  (Phases 0–11)</text><path d="M689,222 L391,222" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="540" y="240" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">teardown-all.ps1</text><path d="M1010,180 L1289,180" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1150" y="170" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">pause-all.ps1</text><path d="M1289,222 L1011,222" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1150" y="240" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">resume-all.ps1  (2–3 min)</text><path d="M1450,246 L1450,300 L230,300 L230,247" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="840" y="292" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">teardown-all.ps1 also works from the paused state</text><text x="850" y="60" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">Every runbook is a PowerShell script driving the AWS CLI in ap-south-1</text><rect x="40" y="360" width="600" height="430" rx="18" fill="none" stroke="#000" stroke-width="1.8"/><text x="54" y="382" font-size="15" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">teardown-all.ps1 · reverse dependency order</text><text x="70" y="410" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 1.</text><text x="102" y="410" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">Scheduler schedule + scheduler role</text><text x="70" y="443" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 2.</text><text x="102" y="443" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">CloudWatch alarms, SNS topic, log group</text><text x="70" y="476" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 3.</text><text x="102" y="476" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">ECS scaling target, service, task defs, cluster</text><text x="70" y="509" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 4.</text><text x="102" y="509" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">ECR repository (force)</text><text x="70" y="542" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 5.</text><text x="102" y="542" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">Task + task-exec IAM roles</text><text x="70" y="575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 6.</text><text x="102" y="575" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">ALB (wait deleted) + target group</text><text x="70" y="608" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 7.</text><text x="102" y="608" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">Secrets (force delete, no recovery)</text><text x="70" y="641" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 8.</text><text x="102" y="641" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">CloudFront functions, OAC, WAF ACL</text><text x="70" y="674" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000"> 9.</text><text x="102" y="674" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">RDS instance (wait deleted) + subnet group</text><text x="70" y="707" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">10.</text><text x="102" y="707" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">Empty and delete both S3 buckets</text><text x="70" y="740" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">11.</text><text x="102" y="740" font-size="15.5" text-anchor="start" font-weight="normal" fill="#000">VPC endpoint, NAT + EIP, SGs, RTs, subnets, IGW, VPC</text><rect x="680" y="360" width="470" height="430" rx="18" fill="none" stroke="#000" stroke-width="1.8"/><text x="694" y="382" font-size="15" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">pause-all.ps1</text><rect x="710.0" y="419.0" width="410" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="915.0" y="446.601" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">1 · ECS desired count → 0</text><text x="915.0" y="464.514" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">container billing stops</text><rect x="710.0" y="529.0" width="410" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="915.0" y="556.601" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">2 · Scheduler → DISABLED</text><text x="915.0" y="574.514" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">no jobs while asleep</text><rect x="710.0" y="639.0" width="410" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="915.0" y="666.601" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">3 · RDS stop-db-instance</text><text x="915.0" y="684.514" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">compute stops, data kept</text><path d="M915.0,481 L915.0,528" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M915.0,591 L915.0,638" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="915.0" y="741.225" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">Still billed while paused: NAT Gateway, ALB, EIP,</text><text x="915.0" y="758.225" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">RDS storage, S3, Secrets Manager</text><rect x="1190" y="360" width="470" height="430" rx="18" fill="none" stroke="#000" stroke-width="1.8"/><text x="1204" y="382" font-size="15" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">resume-all.ps1</text><rect x="1220.0" y="419.0" width="410" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1425.0" y="446.601" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">1 · RDS start + wait available</text><text x="1425.0" y="464.514" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">database first</text><rect x="1220.0" y="529.0" width="410" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1425.0" y="556.601" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">2 · Scheduler → ENABLED</text><text x="1425.0" y="574.514" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">jobs resume</text><rect x="1220.0" y="639.0" width="410" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1425.0" y="666.601" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">3 · ECS desired count → 2</text><text x="1425.0" y="684.514" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">tasks register with ALB</text><path d="M1425.0,481 L1425.0,528" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1425.0,591 L1425.0,638" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1425.0" y="741.225" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">Order matters: tasks only start once</text><text x="1425.0" y="758.225" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">the database accepts connections</text><text x="850.0" y="830" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000">Figure 8.  Operations lifecycle — provisioning, cost-saving sleep mode and full teardown runbooks.</text></svg>