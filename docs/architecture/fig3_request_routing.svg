<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1250" viewBox="0 0 1650 1250" font-family="'Times New Roman', Times, serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.6"/></marker></defs><rect width="1650" height="1250" fill="#fff"/><g transform="translate(0,-110)"><text x="560" y="1282" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Browser request (HTTPS)</text><path d="M560,1262 L560,1197" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="160.0" y="1134.0" width="800" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="1161.9370000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">AWS WAF Web ACL  (gearvault-waf, scope CLOUDFRONT)</text><text x="560" y="1180.1140000000003" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">AWSManagedRulesCommonRuleSet · rate limit 100 requests / 5 min per IP on /api/auth/*</text><path d="M968,1165 L1118,1165" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="968" cy="1165" r="2.2" fill="#777"/><text x="1130" y="1160.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Evaluated at the edge before any origin is reached;</text><text x="1130" y="1180.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">matching requests are blocked with HTTP 403</text><path d="M560,1134 L560,1092" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="160.0" y="1029.0" width="800" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="1056.9370000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">CloudFront distribution — behaviour chosen by path pattern</text><text x="560" y="1075.1140000000003" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">viewer protocol policy: redirect HTTP → HTTPS</text><path d="M968,1060 L1118,1060" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="968" cy="1060" r="2.2" fill="#777"/><text x="1130" y="1055.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Three origins: S3 frontend, S3 media and the ALB;</text><text x="1130" y="1075.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">S3 origins are signed with Origin Access Control</text><path d="M560,1029 L560,1000" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M230,1000 L880,1000" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M230,1000 L230,967" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="238" y="990" font-size="13.5" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">default  /*</text><path d="M520,1000 L520,967" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="528" y="990" font-size="13.5" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">/media/*</text><path d="M880,1000 L880,967" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="888" y="990" font-size="13.5" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">/api/*</text><rect x="105.0" y="904.0" width="250" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="230" y="931.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">spa-rewrite</text><text x="230" y="950.1139999999999" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">no extension → /index.html</text><rect x="395.0" y="904.0" width="250" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="520" y="931.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">strip-media</text><text x="520" y="950.1139999999999" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">/media/items/x → /items/x</text><path d="M125.0,786.0 L125.0,854.0 A105.0,11 0 0 0 335.0,854.0 L335.0,786.0" fill="#fff" stroke="#000" stroke-width="1.5"/><ellipse cx="230" cy="786.0" rx="105.0" ry="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="230" y="821.408" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">S3 Frontend</text><text x="230" y="840.008" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">Bucket</text><path d="M415.0,786.0 L415.0,854.0 A105.0,11 0 0 0 625.0,854.0 L625.0,786.0" fill="#fff" stroke="#000" stroke-width="1.5"/><ellipse cx="520" cy="786.0" rx="105.0" ry="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="520" y="821.408" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">S3 Media Bucket</text><text x="520" y="840.008" font-size="15.5" text-anchor="middle" font-weight="normal" fill="#000">items/* only</text><path d="M230,904 L230,866" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M230,775 L230,738" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M520,904 L520,866" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M520,775 L520,738" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="230" y="722" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">index.html · JS · CSS</text><text x="520" y="722" font-size="16" text-anchor="middle" font-weight="normal" fill="#000">Catalog equipment image</text><text x="230" y="626.075" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">React Router deep links load</text><text x="230" y="645.075" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">without custom error pages,</text><text x="230" y="664.075" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">so API 404s stay JSON</text><text x="520" y="626.075" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">condition/* photos are never</text><text x="520" y="645.075" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">reachable through the CDN;</text><text x="520" y="664.075" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">they need presigned URLs</text><rect x="710.0" y="904.0" width="340" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="931.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Origin request to ALB</text><text x="880" y="950.1139999999999" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">+ X-Origin-Verify · CachingDisabled</text><path d="M1058,935 L1118,935" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1058" cy="935" r="2.2" fill="#777"/><text x="1130" y="930.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Secret header is added by CloudFront and never seen</text><text x="1130" y="950.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">by the browser; API responses are not cached</text><path d="M880,904 L880,852" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="710.0" y="789.0" width="340" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="816.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Application Load Balancer</text><text x="880" y="835.1139999999999" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">alb-sg: TCP 80 from CloudFront only</text><path d="M1058,820 L1118,820" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1058" cy="820" r="2.2" fill="#777"/><text x="1130" y="815.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">The ALB cannot be reached from the open internet:</text><text x="1130" y="835.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">only CloudFront edge IP ranges are admitted</text><path d="M880,789 L880,741" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M880,660.0 L965.0,700 L880,740.0 L795.0,700 Z" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="705.775" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000">Header valid?</text><path d="M965,700 L1069,700" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="975" y="692" font-size="13.5" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">no</text><rect x="1070.0" y="671.0" width="230" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1185" y="696.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Fixed response 403</text><text x="1185" y="715.1139999999999" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">direct-to-ALB requests</text><path d="M880,660 L880,622" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="888" y="645" font-size="13.5" text-anchor="start" font-weight="normal" fill="#000" font-style="italic">yes</text><rect x="710.0" y="559.0" width="340" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="586.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Target group gearvault-api-tg</text><text x="880" y="605.1139999999999" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">IP targets :5000 · health /api/health</text><path d="M1058,590 L1118,590" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1058" cy="590" r="2.2" fill="#777"/><text x="1130" y="585.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Task IPs register automatically (awsvpc); 2 healthy /</text><text x="1130" y="605.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">3 unhealthy checks decide which tasks get traffic</text><path d="M880,559 L880,512" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="710.0" y="449.0" width="340" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="476.93699999999995" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Gunicorn on ECS Fargate</text><text x="880" y="495.114" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">2 sync workers · app-sg · 2 AZs</text><path d="M1058,480 L1118,480" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1058" cy="480" r="2.2" fill="#777"/><text x="1130" y="475.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Non-root python:3.13-slim container;</text><text x="1130" y="495.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">auto-scaled between 2 and 4 tasks on 60 % CPU</text><path d="M880,449 L880,402" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="710.0" y="339.0" width="340" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="366.93699999999995" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Flask middleware</text><text x="880" y="385.114" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">ProxyFix · CORS · JWT + RBAC</text><path d="M1058,370 L1118,370" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1058" cy="370" r="2.2" fill="#777"/><text x="1130" y="365.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">ProxyFix trusts 2 hops (CloudFront + ALB) for client IP;</text><text x="1130" y="385.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">the role is read from the database, not the token</text><path d="M880,339 L880,292" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="710.0" y="229.0" width="340" height="62" rx="7" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="256.937" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">Route blueprints</text><text x="880" y="275.11400000000003" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">/auth · /catalog · /uploads · /health</text><path d="M1058,260 L1118,260" fill="none" stroke="#777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1058" cy="260" r="2.2" fill="#777"/><text x="1130" y="255.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">Pricing, damage, notification and audit services</text><text x="1130" y="275.425" font-size="15.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-style="italic">run inside the request handler</text><path d="M405.0,226.0 L405.0,294.0 A115.0,11 0 0 0 635.0,294.0 L635.0,226.0" fill="#fff" stroke="#000" stroke-width="1.5"/><ellipse cx="520" cy="226.0" rx="115.0" ry="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="520" y="261.54" font-size="15" text-anchor="middle" font-weight="normal" fill="#000">RDS PostgreSQL 16</text><text x="520" y="279.54" font-size="15" text-anchor="middle" font-weight="normal" fill="#000">Multi-AZ</text><path d="M636,260 L709,260" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="672" y="250" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">SQL · TLS</text><path d="M880,229 L880,187" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="880" y="170" font-size="17" text-anchor="middle" font-weight="normal" fill="#000">JSON response</text><text x="825.0" y="1338" font-size="16.5" text-anchor="middle" font-weight="normal" fill="#000">Figure 3.  Request path — how a browser request is filtered at the edge and routed to S3 or the API tier.</text></g></svg>